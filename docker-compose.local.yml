services:
  app:
    build:
      context: .
      dockerfile: ./docker/Dockerfile
      target: web-local
      args:        
        - WWWUID=${UID:-1000}
        - WWWGID=${GID:-1000}
    image: talpx1/simone_cerruti_website
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
      - "${VITE_PORT:-5173}:${VITE_PORT:-5173}"
    volumes:
      - ".:/var/www/html"
      - "~/.ssh:/var/www/.ssh"
    env_file:
      - .env
    environment:
      # Project-scoped GitHub auth: gh reads GH_TOKEN from the repo .env instead
      # of the host-wide ~/.config/gh, so the container can't act on other repos.
      - GH_TOKEN=${GH_TOKEN:-}
      - GITHUB_PERSONAL_ACCESS_TOKEN=${GH_TOKEN:-}
      # Context7 API key auth, avoids the interactive OAuth login whose state
      # lives outside the persisted volumes and is lost on container rebuild.
      - CONTEXT7_API_KEY=${CONTEXT7_API_KEY:-}
      # Passed here and not only through .env so it also applies to `docker exec` shells,
      # which is where test runs are launched from.
      - XDEBUG_MODE=${XDEBUG_MODE:-off}
    extra_hosts:
      # Lets Xdebug reach the IDE on the host (host.docker.internal is not
      # auto-resolved on native/Linux Docker, only on Docker Desktop).
      - "host.docker.internal:host-gateway"
    networks:
      - simone_cerruti_website
    depends_on:
      # Without the health condition the queue workers start against a Postgres that is still
      # initializing, fail, and exhaust Supervisor's retries with no self-recovery.
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      PGPASSWORD: "${DB_PASSWORD}"
      POSTGRES_DB: "${DB_DATABASE}"
      POSTGRES_USER: "${DB_USERNAME}"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - pgsql_data:/var/lib/postgresql/data
    ports:
      - "${FORWARD_DB_PORT:-5432}:5432"
    networks:
      - simone_cerruti_website
    healthcheck:
      test:
        [
          "CMD",
          "pg_isready",
          "-q",
          "-d",
          "${DB_DATABASE}",
          "-U",
          "${DB_USERNAME}",
        ]
      retries: 3
      timeout: 5s

  mailpit:
    image: "axllent/mailpit:latest"
    restart: unless-stopped
    ports:
      - "${FORWARD_MAILPIT_PORT:-1025}:1025"
      - "${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025"
    networks:
      - simone_cerruti_website

networks:
  simone_cerruti_website:
    driver: bridge
volumes:
  pgsql_data:
